<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CDN -->
    <style>
        body {
            background-image: url('{{ url_for("static", filename="bg.png") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen text-white">
    <div class="bg-black bg-opacity-70 p-10 rounded-2xl shadow-2xl max-w-md w-full">
        <h2 class="text-3xl font-bold mb-6 text-center">🔑 Admin Login</h2>
        
        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Username" 
                   class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            
            <input type="password" name="password" placeholder="Password" 
                   class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            
            <button type="submit" 
                    class="w-full px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition-all duration-300 shadow-lg">
                Login
            </button>
        </form>
    </div>
</body>
</html>
