<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CDN -->
    <style>
        body {
            background-image: url('{{ url_for("static", filename="bg.png") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen text-white">
    <div class="bg-black bg-opacity-70 p-10 rounded-2xl shadow-2xl max-w-md w-full">
        <h2 class="text-3xl font-bold mb-6 text-center">⚙️ Admin Panel</h2>
        
        <form method="POST" action="/change-timing" class="space-y-4">
            <div>
                <label class="block text-lg font-medium mb-1">🟢 Green Light Duration (seconds):</label>
                <input type="number" name="green" value="120"
                       class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <div>
                <label class="block text-lg font-medium mb-1">🟡 Yellow Light Duration (seconds):</label>
                <input type="number" name="yellow" value="5"
                       class="w-full p-3 rounded-lg bg-gray-700 border border-gray-500 text-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <p class="text-xs text-gray-400 mt-1">Default: 5s (cannot be changed).</p>
            </div>
            
            <div>
                <label class="block text-lg font-medium mb-1">🔴 Red Light Duration (seconds):</label>
                <input type="number" name="red" value="90"
                       class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            
            <button type="submit" 
                    class="w-full px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition-all duration-300 shadow-lg">
                Update Timings
            </button>
        </form>
    </div>
</body>
</html>
